<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>딜레이더</title>
<meta name="description" content="전날 나온 국내·해외 M&A 기사를 딜 단위로 모아, 새 딜과 단계가 바뀐 딜만 보여줘요.">
<meta name="theme-color" content="#eef2f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1614" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="딜레이더">
<meta property="og:title" content="딜레이더 · 어제의 M&A">
<meta property="og:description" content="매물, IM 배포, 우협, 계약, 딜 클로징까지. 새 딜과 진전된 딜만 매일 아침 정리해요.">
<meta property="og:url" content="https://nhs1816.github.io/dealradar/">

<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="딜레이더">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
body{margin:0;-webkit-tap-highlight-color:transparent}
.wrap{padding-top:calc(20px + env(safe-area-inset-top,0px))!important;padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))!important}
</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
/* 레이아웃: 날짜 → 요약 → 딜 지도(단계별 보드, 누르면 걸러짐) → 지역 탭 → 딜 목록 → 제외 목록.
   단계는 순서가 있는 값이라 황토(검토) → 남색(완료)으로 차례로 짙어지는 색을 써요. */
:root {
  --bg: #eceff2; --surface: #fbfcfd; --ink: #18202e; --muted: #5d6776; --line: #d2d8df; --hover: #e2e7ec;
  --s1: #a8741f; --s2: #7f8530; --s3: #2f8068; --s4: #2a6593; --s5: #343f8c; --s0: #8a4b4b;
  --track: #dde2e8;
  --f-display: "Noto Serif KR", "Apple SD Gothic Neo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151c; --surface: #191f28; --ink: #e5e9ef; --muted: #98a2b1; --line: #2c3440; --hover: #222a35;
  --s1: #d8a650; --s2: #b8bd5c; --s3: #5fbf9f; --s4: #6ea6d6; --s5: #9aa5ec; --s0: #d88f8f;
  --track: #2c3440; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11151c; --surface: #191f28; --ink: #e5e9ef; --muted: #98a2b1; --line: #2c3440; --hover: #222a35;
  --s1: #d8a650; --s2: #b8bd5c; --s3: #5fbf9f; --s4: #6ea6d6; --s5: #9aa5ec; --s0: #d88f8f;
  --track: #2c3440; color-scheme: dark }

body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 22px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--s4); outline-offset: 2px; }

/* 머리: 앱 이름은 작게, 날짜를 크게 */
.mast { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 14px 20px; }
.brand { display: flex; align-items: center; gap: 8px; font: 700 14px/1 var(--f-body); color: var(--muted); }
.brand svg { width: 18px; height: 18px; flex: none; }
h1 { font: 900 clamp(32px, 7vw, 46px)/1.08 var(--f-display); margin: 10px 0 0; letter-spacing: -.01em; }
h1 small { display: block; font: 600 15px/1.4 var(--f-body); color: var(--muted); margin-top: 8px; letter-spacing: 0; }

/* 미니 달력 (크기는 tune.html 로 맞춘 값 그대로) */
.calbox { width: 181px; max-width: 100%; box-sizing: border-box; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 5px 6px 6px; display: grid; gap: 2px; }
.cal-head { display: flex; justify-content: space-between; align-items: center; gap: 4px; height: 14px; }
.cal-head h2 { margin: 0; font: 600 9.5px/1 var(--f-body); }
.cal-head .arrows { display: flex; gap: 1px; }
.cal-head .arrows button { width: 16px; height: 14px; padding: 0; border: 0; background: none; border-radius: 3px; cursor: pointer; font-size: 12px; line-height: 1; color: var(--muted); }
.cal-head .arrows button:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.cal-head .arrows button:disabled { opacity: .3; cursor: default; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; text-align: center; }
.cal .wd { font-size: 9px; line-height: 11px; color: var(--muted); }
.day { height: 13px; border-radius: 3px; border: 0; background: none; display: flex; align-items: center; justify-content: center;
  font: 500 9px/1 var(--f-body); color: var(--muted); opacity: .4; padding: 0; }
.day.has { cursor: pointer; opacity: 1; color: var(--ink); font-weight: 700; background: var(--hover); }
.day.has:hover { outline: 1px solid var(--muted); }
.day.sel { background: var(--ink); color: var(--surface); }
.day.today { text-decoration: underline; text-underline-offset: 2px; }

.summary { margin: 0; max-width: 62ch; font-size: 16.5px; line-height: 1.7; }

/* 딜 지도: 단계 다섯 칸에 그날 딜 이름을 꽂아 둔 보드. 칸 머리를 누르면 그 단계만, 이름을 누르면 그 카드로 */
.board { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.board-cols { display: grid; grid-template-columns: minmax(0, 1fr); }
.col { --sc: var(--muted); display: grid; grid-template-columns: 8.5em minmax(0, 1fr); align-items: start; gap: 4px 12px;
  padding: 10px 14px; border-top: 1px solid var(--line); }
.col:first-child { border-top: 0; }
.col-h { display: flex; flex-direction: column; gap: 6px; border: 0; background: none; padding: 2px 0 0; text-align: left; cursor: pointer; }
.col-h .nm { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13.5px; font-weight: 600; }
.col-h .nm b { font-size: 17px; font-weight: 700; color: var(--sc); }
.col-h .bar { height: 4px; border-radius: 2px; background: var(--sc); }
.col.zero .col-h { cursor: default; }
.col.zero .col-h .nm, .col.zero .col-h .nm b { color: var(--muted); font-weight: 500; }
.col.zero .col-h .bar { background: var(--track); }
.col.off { opacity: .38; }
.col.on { background: color-mix(in srgb, var(--sc) 7%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; padding-top: 1px; }
.chip { border: 1px solid color-mix(in srgb, var(--sc) 35%, var(--line)); background: none; border-radius: 6px; padding: 2px 8px;
  font-size: 13px; line-height: 1.5; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip:hover { background: color-mix(in srgb, var(--sc) 12%, transparent); }
.chip .rg { color: var(--muted); font-size: 11.5px; margin-right: 4px; }
.chip.hid { opacity: .4; }
.chips .none { color: var(--muted); font-size: 13px; }
.board-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; padding: 8px 14px; border-top: 1px solid var(--line);
  font-size: 12.5px; color: var(--muted); }
.board-foot button { border: 0; background: none; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }
@media (min-width: 760px) {
  .board-cols { grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); }
  .col { grid-template-columns: minmax(0, 1fr); border-top: 0; border-left: 1px solid var(--line); padding: 12px 12px 14px; gap: 10px; align-content: start; }
  .col:first-child { border-left: 0; }
  .chips { flex-direction: column; align-items: flex-start; }
  .chip { white-space: normal; text-align: left; overflow-wrap: anywhere; }
}

/* 지역 탭 (위에 붙어 다녀요) */
.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 8px; margin-block: -8px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.seg { display: inline-flex; border-bottom: 1px solid var(--line); gap: 18px; }
.seg button { border: 0; background: none; padding: 4px 0 6px; margin-bottom: -1px; cursor: pointer; font-size: 15px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
.seg button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.seg button small { font-size: 12px; font-weight: 500; margin-left: 3px; }
.fnote { font-size: 13px; color: var(--muted); }
.fnote button { border: 0; background: none; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }

/* 지역 묶음 */
.region { display: grid; gap: 12px; }
.region h2 { font: 700 20px var(--f-display); margin: 0; display: flex; align-items: baseline; gap: 10px; }
.region h2 small { font: 500 13px var(--f-body); color: var(--muted); }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); }

/* 딜 카드: 왼쪽 띠 색이 단계 */
.deal { --sc: var(--muted); background: var(--surface); border-radius: 4px 10px 10px 4px; border-left: 4px solid var(--sc);
  padding: 15px 16px 13px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; align-content: start; scroll-margin-top: 64px; }
.top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 12.5px; }
.stg { font-weight: 700; color: var(--sc); }
.sector { color: var(--muted); }
.kind { margin-left: auto; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.kind.new { color: var(--ink); border-color: var(--ink); }
.deal h3 { margin: 0; font-size: 17px; line-height: 1.45; font-weight: 700; text-wrap: balance; }
.terms { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin: 0; font-size: 13.5px; }
.terms dt { color: var(--muted); }
.terms dd { margin: 0; min-width: 0; }
.terms dd.val { font-weight: 600; }

/* 단계 사다리: 지금 단계까지 채우고 이름은 지금 단계만 진하게 */
.ladder { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.ladder i { height: 5px; border-radius: 2px; background: var(--track); }
.ladder i.on { background: var(--sc); }
.ladder-l { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; font-size: 11px; color: var(--muted); margin-top: -7px; }
.ladder-l span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .7; }
.ladder-l span.cur { color: var(--sc); font-weight: 700; opacity: 1; }
.deal.dropped .ladder i.on { background: var(--track); }
.note { margin: 0; font-size: 14px; }
.prev { margin: 0; font-size: 12.5px; color: var(--muted); padding-left: 10px; border-left: 2px solid var(--track); }
.links { list-style: none; margin: 0; padding: 9px 0 0; border-top: 1px solid var(--line); display: grid; gap: 3px; font-size: 13px; }
.links li { min-width: 0; }
.links a { text-decoration: none; display: flex; gap: 8px; min-width: 0; overflow: hidden; }
.links a:hover .t { text-decoration: underline; }
.links .s { flex: none; color: var(--muted); font-size: 12px; min-width: 5.5em; }
.links .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@keyframes flash { from { box-shadow: 0 0 0 3px color-mix(in srgb, var(--sc) 55%, transparent); } to { box-shadow: 0 0 0 3px transparent; } }
@media (prefers-reduced-motion: no-preference) { .deal.flash { animation: flash 1.4s ease-out; } }
@media (prefers-reduced-motion: reduce) { .deal.flash { outline: 2px solid var(--sc); } }

/* 제외 */
details.skip { border-top: 1px solid var(--line); padding: 14px 0 0; }
details.skip summary { cursor: pointer; font-weight: 600; }
details.skip p { color: var(--muted); font-size: 13px; margin: 8px 0; }
.skiplist { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px 24px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); font-size: 13px; }
.skiplist li { display: flex; gap: 8px; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 5px 0; }
.skiplist li > span:last-child { color: var(--muted); text-align: right; }
.skiplist .nm { display: grid; gap: 2px; min-width: 0; }
.skiplinks { display: flex; flex-wrap: wrap; gap: 0 10px; font-size: 12px; }
.skiplinks a { color: var(--s4); text-decoration: none; white-space: nowrap; }
.skiplinks a:hover { text-decoration: underline; }
.empty { color: var(--muted); padding: 24px 0; }
footer { color: var(--muted); font-size: 12px; }
</style>

<div class="wrap">
  <header class="mast">
    <div>
      <div class="brand"><svg viewBox="0 0 18 18" aria-hidden="true"><rect x="1" y="11" width="3" height="5" rx="1" fill="var(--s1)"/><rect x="5" y="9" width="3" height="7" rx="1" fill="var(--s2)"/><rect x="9" y="6" width="3" height="10" rx="1" fill="var(--s3)"/><rect x="13" y="2" width="3" height="14" rx="1" fill="var(--s5)"/></svg>딜레이더</div>
      <h1 id="h">—</h1>
    </div>
    <nav class="calbox" id="calbox" aria-label="날짜 선택 달력">
      <div class="cal-head">
        <h2 id="calTitle"></h2>
        <div class="arrows"><button id="calPrev" aria-label="이전 달">‹</button><button id="calNext" aria-label="다음 달">›</button></div>
      </div>
      <div class="cal" id="cal"></div>
    </nav>
  </header>

  <p class="summary" id="summary"></p>

  <section class="board" id="board" aria-label="단계별 딜 지도"></section>

  <div class="filters">
    <div class="seg" role="group" aria-label="지역" id="regSeg"></div>
    <span class="fnote" id="fnote"></span>
  </div>

  <main id="feed"></main>
  <details class="skip" id="skip"></details>
  <footer id="foot"></footer>
</div>

<script src="days/index.js"></script>
<script>
// 딜 단계 5개. 세부 단계(stage)는 데이터에 그대로 두고 화면에서만 묶어요.
const GROUPS = [
  { key: "g1", name: "매각 검토", short: "검토", stages: ["explore", "adviser"] },
  { key: "g2", name: "IM·실사", short: "IM·실사", stages: ["marketing", "short"] },
  { key: "g3", name: "입찰·협상", short: "입찰", stages: ["prelim", "binding", "pref"] },
  { key: "g4", name: "계약·승인", short: "계약", stages: ["signed", "approval"] },
  { key: "g5", name: "인수 완료", short: "완료", stages: ["closed"] }];
const DROP = { key: "g0", name: "무산·철회", stages: ["dropped"] };
const GROUP_OF = {};
GROUPS.forEach((g, i) => g.stages.forEach(s => GROUP_OF[s] = i));
const STAGE_LABEL = { explore: "매물·매각 검토", adviser: "주관사 선정", marketing: "티저·IM 배포", prelim: "예비입찰", short: "숏리스트·실사",
  binding: "본입찰", pref: "우선협상", signed: "계약 체결", approval: "당국·주총 승인", closed: "거래종결", dropped: "무산·철회" };
const KIND_TEXT = { "신규": "첫 보도", "진전": "단계 진전", "변동": "변동 있음" };
const WD = "일월화수목금토";

const index = (window.DAY_INDEX || []).slice().sort();
const state = { day: index[index.length - 1], r: "전체", s: "전체" };
try { const s = JSON.parse(localStorage.getItem("dealradar:f2") || "{}"); if (s.r) state.r = s.r; if (s.s) state.s = s.s; } catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dateOf = d => new Date(d + "T00:00:00");
const colorOf = d => d.stage === "dropped" ? "var(--s0)" : (GROUP_OF[d.stage] ?? -1) >= 0 ? `var(--s${GROUP_OF[d.stage] + 1})` : "var(--muted)";
const groupKey = d => d.stage === "dropped" ? DROP.key : GROUPS[GROUP_OF[d.stage]]?.key;
const save = () => { try { localStorage.setItem("dealradar:f2", JSON.stringify({ r: state.r, s: state.s })); } catch (e) {} };

function loadDay(day) {
  if (window.DAYS && window.DAYS[day]) return Promise.resolve(window.DAYS[day]);
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = `days/${day}.js`; s.onload = () => ok(window.DAYS[day]); s.onerror = fail;
    document.head.appendChild(s);
  });
}

function card(d) {
  const gi = GROUP_OF[d.stage] ?? -1, g = GROUPS[gi];
  const bars = GROUPS.map((_, i) => `<i class="${i <= gi ? "on" : ""}"></i>`).join("");
  const marks = GROUPS.map((x, i) => `<span${i === gi ? ' class="cur"' : ""}>${x.short}</span>`).join("");
  const rows = [["대상", d.target], ["매도", d.seller], ["인수", d.buyer], ["금액", d.value]]
    .filter(r => r[1]).map(([k, v]) => `<dt>${k}</dt><dd${k === "금액" ? ' class="val"' : ""}>${esc(v)}</dd>`).join("");
  const links = d.links.map(l => `<li><a href="${esc(l.url)}" target="_blank" rel="noopener"><span class="s">${esc(l.source)}</span><span class="t">${esc(l.title)}</span></a></li>`).join("");
  return `<article class="deal${d.stage === "dropped" ? " dropped" : ""}" id="${esc(d._id)}" style="--sc:${colorOf(d)}">
    <div class="top"><span class="stg">${STAGE_LABEL[d.stage] || ""}</span><span class="sector">${esc(d.sector)}</span>${KIND_TEXT[d.kind] ? `<span class="kind${d.kind === "신규" ? " new" : ""}">${KIND_TEXT[d.kind]}</span>` : ""}</div>
    <h3>${esc(d.title)}</h3>
    ${d.stage === "dropped" ? "" : `<div class="ladder" role="img" aria-label="딜 단계: ${g ? g.name : ""}">${bars}</div>
    <div class="ladder-l" aria-hidden="true">${marks}</div>`}
    <dl class="terms">${rows}</dl>
    ${d.note ? `<p class="note">${esc(d.note)}</p>` : ""}
    ${d.prev ? `<p class="prev">이전 흐름: ${esc(d.prev)}</p>` : ""}
    <ul class="links">${links}</ul>
  </article>`;
}

// 딜 지도: 지역 필터는 따르고, 단계 필터는 보드 자체가 고르는 곳이라 모든 칸을 보여줘요.
function renderBoard(data) {
  const deals = data.deals.filter(d => state.r === "전체" || d.region === state.r);
  const cols = GROUPS.map((g, i) => ({ ...g, color: `var(--s${i + 1})` }));
  if (data.deals.some(d => d.stage === "dropped")) cols.push({ ...DROP, color: "var(--s0)" });
  const html = cols.map(c => {
    const list = deals.filter(d => c.stages.includes(d.stage));
    const cls = ["col", list.length ? "" : "zero", state.s === c.key ? "on" : state.s !== "전체" ? "off" : ""].filter(Boolean).join(" ");
    const chips = list.map(d => `<button class="chip" data-go="${esc(d._id)}" title="${esc(d.title)}">${state.r === "전체" ? `<span class="rg">${d.region}</span>` : ""}${esc(d.key || d.title)}</button>`).join("")
      || '<span class="none">없음</span>';
    return `<div class="${cls}" style="--sc:${c.color}">
      <button class="col-h" data-s="${c.key}" aria-pressed="${state.s === c.key}"${list.length ? "" : " disabled"}><span class="nm">${c.name}<b>${list.length}</b></span><span class="bar"></span></button>
      <div class="chips">${chips}</div></div>`;
  }).join("");
  const sk = (data.skipped || []).length;
  $("board").innerHTML = `<div class="board-cols" style="--n:${cols.length}">${html}</div>
    <div class="board-foot"><span>단계 이름을 누르면 그 단계 딜만, 딜 이름을 누르면 해당 카드로 이동해요.</span>${sk ? `<button data-skip>후속 기사라 뺀 딜 ${sk}건</button>` : ""}</div>`;
  $("board").querySelectorAll(".col-h").forEach(b => b.onclick = () => { state.s = state.s === b.dataset.s ? "전체" : b.dataset.s; save(); render(); });
  $("board").querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    if (state.s !== "전체") { state.s = "전체"; save(); render(); }
    const el = document.getElementById(b.dataset.go); if (!el) return;
    el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  });
  const sb = $("board").querySelector("[data-skip]");
  if (sb) sb.onclick = () => { $("skip").open = true; $("skip").scrollIntoView({ behavior: "smooth" }); };
}

async function render() {
  renderCal();
  if (!state.day) { $("feed").innerHTML = '<p class="empty">아직 모은 날짜가 없어요. 매일 아침 전날 기사가 여기에 쌓여요.</p>'; return; }

  const data = await loadDay(state.day);
  data.deals.forEach((d, i) => d._id = `deal-${i}`);
  const t = dateOf(state.day);
  $("h").innerHTML = `${t.getMonth() + 1}월 ${t.getDate()}일 ${WD[t.getDay()]}요일<small>이날 보도된 M&amp;A 신규·진전 딜 ${data.deals.length}건</small>`;
  $("summary").textContent = data.summary || "";

  // 고른 단계가 이날 없으면 전체로 돌려요
  if (state.s !== "전체" && !data.deals.some(d => groupKey(d) === state.s)) state.s = "전체";
  renderBoard(data);

  const cnt = r => data.deals.filter(d => r === "전체" || d.region === r).length;
  $("regSeg").innerHTML = ["전체", "국내", "해외"].map(r => `<button data-r="${r}" aria-pressed="${state.r === r}">${r}<small>${cnt(r)}</small></button>`).join("");
  $("regSeg").querySelectorAll("[data-r]").forEach(b => b.onclick = () => { state.r = b.dataset.r; save(); render(); });
  const sel = [...GROUPS, DROP].find(g => g.key === state.s);
  $("fnote").innerHTML = sel ? `${sel.name} 단계만 보는 중 · <button id="clearS">모든 단계 보기</button>` : "";
  if (sel) $("clearS").onclick = () => { state.s = "전체"; save(); render(); };

  const shown = data.deals.filter(d => (state.r === "전체" || d.region === state.r) && (state.s === "전체" || groupKey(d) === state.s));
  const order = d => d.stage === "dropped" ? 9 : (GROUP_OF[d.stage] ?? 8);
  $("feed").innerHTML = ["국내", "해외"].map(r => {
    const list = shown.filter(d => d.region === r).sort((a, b) => order(b) - order(a));
    if (!list.length) return "";
    return `<section class="region"><h2>${r}<small>${list.length}건</small></h2><div class="grid">${list.map(card).join("")}</div></section>`;
  }).join("") || '<p class="empty">이 조건에 맞는 딜이 없어요. 위에서 지역이나 단계를 바꿔 보세요.</p>';
  $("feed").style.display = "grid"; $("feed").style.gap = "30px";

  const sk = data.skipped || [];
  $("skip").hidden = !sk.length;
  $("skip").innerHTML = `<summary>후속 기사라 뺀 딜 ${sk.length}건</summary>
    <p>어제 기사가 있었지만, 그 전에 이미 같은 단계로 보도된 딜이에요.</p>
    <ul class="skiplist">${sk.map(([a, b, ls = []]) => `<li><span class="nm"><span>${esc(a)}</span>${ls.length ? `<span class="skiplinks">${ls.map(l =>
      `<a href="${esc(l.url)}" target="_blank" rel="noopener" title="${esc(l.title)}">${esc(l.source)} ↗</a>`).join("")}</span>` : ""}</span><span>${esc(b)}</span></li>`).join("")}</ul>`;
  const st = data.stats || {};
  $("foot").textContent = `구글 뉴스에서 ${state.day} 하루 동안 나온 M&A 관련 기사 ${st.raw ?? "-"}건(국내 ${st.ko ?? "-"}, 해외 ${st.en ?? "-"})을 모아 딜 단위로 정리했어요. 이미 같은 단계로 보도된 딜은 과거 180일 보도와 비교해 빼요.`;
}

// 달력: 보고 있는 날짜의 달을 보여주고, 딜이 있는 날만 버튼이에요.
const ymd = (y, m, d) => `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
const ymOf = d => { const [y, m] = d.split("-").map(Number); return [y, m - 1]; };
const TODAY = (() => { const t = new Date(); return ymd(t.getFullYear(), t.getMonth(), t.getDate()); })();
const HAS = new Set(index);
let calYM = state.day ? ymOf(state.day) : ymOf(TODAY);
const ymKey = ([y, m]) => y * 12 + m;
function renderCal() {
  const [y, m] = calYM;
  $("calTitle").textContent = `${y}년 ${m + 1}월`;
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  let h = [..."일월화수목금토"].map(w => `<span class="wd">${w}</span>`).join("");
  for (let k = 0; k < first; k++) h += "<span></span>";
  for (let d = 1; d <= days; d++) {
    const ds = ymd(y, m, d);
    const cls = ["day", HAS.has(ds) ? "has" : "", ds === state.day ? "sel" : "", ds === TODAY ? "today" : ""].filter(Boolean).join(" ");
    h += HAS.has(ds)
      ? `<button class="${cls}" data-d="${ds}" aria-label="${m + 1}월 ${d}일 딜 보기"${ds === state.day ? ' aria-current="date"' : ""}>${d}</button>`
      : `<span class="${cls}" aria-label="${m + 1}월 ${d}일 발행 없음">${d}</span>`;
  }
  $("cal").innerHTML = h;
  $("cal").querySelectorAll("button.day").forEach(b => b.onclick = () => { state.day = b.dataset.d; render(); });
  $("calPrev").disabled = !index.length || ymKey(calYM) <= ymKey(ymOf(index[0]));
  $("calNext").disabled = !index.length || ymKey(calYM) >= ymKey(ymOf(index[index.length - 1]));
}
$("calPrev").onclick = () => { calYM = calYM[1] === 0 ? [calYM[0] - 1, 11] : [calYM[0], calYM[1] - 1]; renderCal(); };
$("calNext").onclick = () => { calYM = calYM[1] === 11 ? [calYM[0] + 1, 0] : [calYM[0], calYM[1] + 1]; renderCal(); };
render();
</script>

<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
